<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Home Controller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 300px;
        }
        h2 { margin-bottom: 25px; }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
            width: 80%;
        }
        .btn-on { background-color: #00b894; color: white; }
        .btn-on:hover { background-color: #55efc4; }
        .btn-off { background-color: #d63031; color: white; }
        .btn-off:hover { background-color: #ff7675; }
        #statusText { margin-top: 20px; font-size: 16px; color: #a29bfe; }
    </style>
</head>
<body>

<div class="card">
    <h2>Device Control</h2>
    <button class="btn btn-on" onclick="sendData('ON')">TURN ON</button>
    <button class="btn btn-off" onclick="sendData('OFF')">TURN OFF</button>
    <div id="statusText">Status: Ready</div>
</div>

<script>
    // Replace with your Firebase Database URL (e.g., https://myesp8266app-default-rtdb.firebaseio.com)
    const databaseURL = "https://test-5b6ed-default-rtdb.firebaseio.com/";

    function sendData(status) {
        document.getElementById('statusText').innerText = "Sending command...";
        
        fetch(`${databaseURL}/LED_STATUS.json`, {
            method: 'PUT',
            body: JSON.stringify(status),
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('statusText').innerText = "Status: LED turned " + status;
        })
        .catch(error => {
            document.getElementById('statusText').innerText = "Error sending command!";
            console.error(error);
        });
    }
</script>

</body>
</html>
