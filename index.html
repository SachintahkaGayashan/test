<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTR-8A Sensor Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 450px;
            max-width: 100%;
        }
        h2 { margin-bottom: 20px; color: #00b894; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .sensor-box {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .sensor-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .sensor-value {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .status-bar {
            margin-top: 20px;
            font-size: 14px;
            color: #a855f7;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>QTR-8A Sensor Array Live View</h2>
    
    <div class="grid-container" id="sensorGrid">
        <!-- Dynamically filled sensor boxes -->
    </div>

    <div class="status-bar" id="statusText">Connecting to Firebase...</div>
</div>

<script>
    const databaseURL = "https://test-5b6ed-default-rtdb.firebaseio.com/";

    // Generate 8 sensor boxes
    const grid = document.getElementById('sensorGrid');
    for (let i = 0; i < 8; i++) {
        grid.innerHTML += `
            <div class="sensor-box">
                <div class="sensor-label">S${i+1}</div>
                <div class="sensor-value" id="val${i}">---</div>
            </div>
        `;
    }

    function fetchQTRData() {
        // Updated to match exact Firebase path: /QTR_Sensors/s.json
        fetch(`${databaseURL}/QTR_Sensors/s.json`)
        .then(res => res.json())
        .then(data => {
            if (data) {
                document.getElementById('statusText').innerText = "Status: Receiving Live Data";
                
                // data is an array/object containing values from index 0 to 7
                for (let i = 0; i < 8; i++) {
                    const valElement = document.getElementById(`val${i}`);
                    if (valElement && data[i] !== undefined) {
                        valElement.innerText = data[i];
                    }
                }
            } else {
                document.getElementById('statusText').innerText = "Status: No Data Found";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('statusText').innerText = "Status: Connection Error";
        });
    }

    // Poll Firebase every 300ms
    setInterval(fetchQTRData, 300);
</script>

</body>
</html>
