<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Panel & Serial Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 350px;
            margin-bottom: 20px;
        }
        h2, h3 { margin-bottom: 15px; }
        .btn { padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 8px 0; transition: 0.3s; width: 100%; }
        .btn-on { background-color: #00b894; color: white; }
        .btn-off { background-color: #d63031; color: white; }
        
        /* Serial Monitor Terminal Box */
        .console-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }
        #serialConsole {
            background-color: #020617;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            border: 1px solid #1e293b;
            white-space: pre-wrap;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Robot Control</h2>
    <button class="btn btn-on" onclick="sendData('ON')">TURN ON</button>
    <button class="btn btn-off" onclick="sendData('OFF')">TURN OFF</button>
</div>

<div class="console-card">
    <h3>Serial Data Output</h3>
    <div id="serialConsole">Waiting for live stream...</div>
</div>

<script>
    const databaseURL = "https://test-5b6ed-default-rtdb.firebaseio.com/";
    let lastMsg = "";

    function sendData(status) {
        fetch(`${databaseURL}/LED_STATUS.json`, {
            method: 'PUT',
            body: JSON.stringify(status),
            headers: { 'Content-Type': 'application/json' }
        });
    }

    function fetchSerialData() {
        fetch(`${databaseURL}/SERIAL_OUTPUT.json`)
        .then(res => res.json())
        .then(data => {
            if (data && data !== lastMsg) {
                lastMsg = data;
                const consoleBox = document.getElementById('serialConsole');
                
                // Clear placeholder text if it's the first log
                if (consoleBox.innerText === "Waiting for live stream...") {
                    consoleBox.innerText = "";
                }

                // Add timestamp and append new log line
                const time = new Date().toLocaleTimeString();
                consoleBox.innerText += `[${time}] ${data}\n`;
                
                // Auto scroll to bottom
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }
        })
        .catch(err => console.error(err));
    }

    // Fetch data every 500ms
    setInterval(fetchSerialData, 500);
</script>

</body>
</html>
